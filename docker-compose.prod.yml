# ==============================================================================
# Dokploy Production Docker Compose for Billza Platform
# Self-hosted PaaS deployment with Traefik reverse proxy (managed by Dokploy)
# Domains:
#   - Frontend: https://billza.xyz (and https://www.billza.xyz)
#   - Backend:  https://api.billza.xyz
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billza_db}
      POSTGRES_USER: ${POSTGRES_USER:-billza_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billza_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billza_user} -d ${POSTGRES_DB:-billza_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - DJANGO_DEBUG=False
      - USE_POSTGRES=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-billza_db}
      - POSTGRES_USER=${POSTGRES_USER:-billza_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-billza_secure_password_2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-billza_user}:${POSTGRES_PASSWORD:-billza_secure_password_2026}@db:5432/${POSTGRES_DB:-billza_db}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-api.billza.xyz,billza.xyz,www.billza.xyz,.billza.xyz,web,localhost,127.0.0.1}
      - CORS_ALLOW_ALL_ORIGINS=False
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://billza.xyz,https://www.billza.xyz,https://api.billza.xyz}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://billza.xyz,https://www.billza.xyz,https://api.billza.xyz}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=true
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.billza-api.rule=Host(`${API_DOMAIN:-api.billza.xyz}`)"
      - "traefik.http.routers.billza-api.entrypoints=websecure"
      - "traefik.http.routers.billza-api.tls=true"
      - "traefik.http.routers.billza-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.billza-api.loadbalancer.server.port=8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - DJANGO_DEBUG=False
      - USE_POSTGRES=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-billza_db}
      - POSTGRES_USER=${POSTGRES_USER:-billza_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-billza_secure_password_2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-billza_user}:${POSTGRES_PASSWORD:-billza_secure_password_2026}@db:5432/${POSTGRES_DB:-billza_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - DJANGO_DEBUG=False
      - USE_POSTGRES=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-billza_db}
      - POSTGRES_USER=${POSTGRES_USER:-billza_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-billza_secure_password_2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-billza_user}:${POSTGRES_PASSWORD:-billza_secure_password_2026}@db:5432/${POSTGRES_DB:-billza_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  soroban_indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py run_soroban_event_listener
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
      - DJANGO_DEBUG=False
      - USE_POSTGRES=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-billza_db}
      - POSTGRES_USER=${POSTGRES_USER:-billza_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-billza_secure_password_2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-billza_user}:${POSTGRES_PASSWORD:-billza_secure_password_2026}@db:5432/${POSTGRES_DB:-billza_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.billza.xyz/api}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-https://billza.xyz}
        VITE_STELLAR_NETWORK: ${VITE_STELLAR_NETWORK:-TESTNET}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.billza-frontend.rule=Host(`${FRONTEND_DOMAIN:-billza.xyz}`) || Host(`www.${FRONTEND_DOMAIN:-billza.xyz}`)"
      - "traefik.http.routers.billza-frontend.entrypoints=websecure"
      - "traefik.http.routers.billza-frontend.tls=true"
      - "traefik.http.routers.billza-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.billza-frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
